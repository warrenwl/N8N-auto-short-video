services:
  video-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      TTS_BASE_URL: http://host.docker.internal:8010
      VIDEO_WIDTH: "1080"
      VIDEO_HEIGHT: "1920"
      VIDEO_FPS: "30"
    volumes:
      - ./data:/data
